---
- hosts: server2
  become: yes
  become_method: sudo
  remote_user: root

  vars:
    service_name: jwt-authentication-service
    local_jar_path: /home/ubuntu/workspace/Microservice-Dev/Backend/Microservices/JWTAuthenticationManagement/target/JWTAuthenticationManagement-0.0.1-SNAPSHOT.jar
    remote_jar_path: /opt/DeploymentFiles/JWTAuthenticationManagement-0.0.1-SNAPSHOT.jar
    remote_jar_directory: /opt/DeploymentFiles
    systemd_service_file: /etc/systemd/system/{{ service_name }}.service

  tasks:
    - name: Create application directory
      file:
        path: "{{ remote_jar_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy and deploy JWTAuthenticationManagement JAR file
      copy:
        src: "{{ local_jar_path }}"
        dest: "{{ remote_jar_path }}"
        owner: root
        group: root
        mode: '0755'
      notify:
        - restart jwt-authentication-service

    - name: Restart JWT Authentication Service
      systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes

    - name: Copy and deploy CustomerManagement JAR file
      copy:
        src: /home/ubuntu/workspace/Microservice-Dev/Backend/Microservices/CustomerManagement/target/CustomerManagement-0.0.1-SNAPSHOT.jar
        dest: /opt/DeploymentFiles/CustomerManagement-0.0.1-SNAPSHOT.jar
        owner: root
        group: root
        mode: '0755'
      notify:
        - restart customer-management

    - name: Restart Customer Management
      systemd:
        name: customer-management
        state: restarted
        daemon_reload: yes

    - name: Copy and deploy UploadDownloadFileManagement JAR file
      copy:
        src: /home/ubuntu/workspace/Microservice-Dev/Backend/Microservices/UploadDownloadFileManagement/target/UploadDownloadFileManagement-0.0.1-SNAPSHOT.jar
        dest: /opt/DeploymentFiles/UploadDownloadFileManagement-0.0.1-SNAPSHOT.jar
        owner: root
        group: root
        mode: '0755'
      notify:
        - restart upload-download-file-management

    - name: Restart Upload Download File Management
      systemd:
        name: upload-download-file-management
        state: restarted
        daemon_reload: yes

    - name: Copy and deploy ProductCategoryManagement JAR file
