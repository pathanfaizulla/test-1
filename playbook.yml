        dest: /opt/DeploymentFiles/ProductCategoryManagement-0.0.1-SNAPSHOT.jar
        owner: root
        group: root
        mode: '0755'
      notify:
        - restart product-category-management

    - name: Restart Product Category Management
      systemd:
        name: product-category-management
        state: restarted
        daemon_reload: yes

    - name: Copy and deploy ProductManagement JAR file
      copy:
        src: /home/ubuntu/workspace/Microservice-Dev/Backend/Microservices/ProductManagement/target/ProductManagement-0.0.1-SNAPSHOT.jar
        dest: /opt/DeploymentFiles/ProductManagement-0.0.1-SNAPSHOT.jar
        owner: root
        group: root
